name: CI

on:
    push:
        branches: [newMain, main]
    pull_request:
        branches: [newMain, main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Lint & Build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint (oxlint)
              run: bun run lint

            - name: Format check (oxfmt)
              run: bun run fmt:check

            - name: Build (astro)
              run: bun run build

            - name: Verify build output
              run: |
                  test -f dist/index.html
                  test -f dist/rss.xml
                  test -f dist/sitemap-index.xml
                  test -f dist/llms-full.txt
                  test -f dist/index.md
                  test -f dist/about.md
                  test -f dist/archives.md
                  test -f dist/categories.md
                  test -f dist/tags.md
                  test -f dist/links.md
                  test -f dist/words.md
                  test -d dist/posts
                  test -d dist/pagefind
                  test $(find dist -name '*.md' | wc -l) -gt 0
                  echo "Build artifacts OK"
                  ls -la dist | head -30
