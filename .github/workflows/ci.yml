name: CI

on:
    push:
        branches: [newMain, main]
    pull_request:
        branches: [newMain, main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Validate
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Cache Astro incremental build
              uses: actions/cache@v5
              with:
                  path: node_modules/.astro
                  key: astro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
                  restore-keys: |
                      astro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

            - name: Install dependencies
              run: bun ci

            - name: Validate
              run: bun run validate
