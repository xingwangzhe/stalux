name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  registry-url: https://registry.npmjs.org

            - run: npm publish --provenance --access public
