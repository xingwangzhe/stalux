name: Publish to npm

on:
    workflow_dispatch:
    push:
        tags:
            - "v*.*.*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - name: Publish with OIDC (no token)
              run: |
                  # Only set registry, no auth token — OIDC handles auth via --provenance
                  echo "@xingwangzhe:registry=https://registry.npmjs.org" >> .npmrc
                  echo "registry=https://registry.npmjs.org" >> .npmrc
                  npm publish --provenance --access public
