name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup Node.js for trusted publishing
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun ci

            - name: Validate
              run: bun run validate

            - name: Verify 1.x version and matching release tag
              run: >-
                  bun -e 'const manifest = await Bun.file("package.json").json();
                  if (!/^1\.\d+\.\d+$/.test(manifest.version)) {
                    throw new Error(`Stalux releases must stay on 1.x.x; found ${manifest.version}`);
                  }
                  if (!process.env.GITHUB_REF.startsWith("refs/tags/")) {
                    throw new Error("The publish workflow must run from a version tag");
                  }
                  const expected = `v${manifest.version}`;
                  if (process.env.GITHUB_REF_NAME !== expected) {
                    throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
                  }'

            # Publishing is the only npm CLI exception: npm Trusted Publishing exchanges
            # GitHub's OIDC identity for a short-lived token and emits provenance.
            - name: Publish package with provenance
              run: npm publish --provenance --access public --tag latest

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: >-
                  gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
                  gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
