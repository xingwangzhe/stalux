name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun ci

            - name: Validate
              run: bun run validate

            - name: Verify tag matches package version
              if: startsWith(github.ref, 'refs/tags/v')
              run: >-
                  bun -e 'const manifest = await Bun.file("package.json").json();
                  const expected = `v${manifest.version}`;
                  if (process.env.GITHUB_REF_NAME !== expected) {
                    throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
                  }'

            # Publishing is the only npm CLI exception: npm Trusted Publishing exchanges
            # GitHub's OIDC identity for a short-lived token and emits provenance.
            - name: Setup Node.js for trusted publishing
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Publish package with provenance
              run: npm publish --provenance --access public
