name: Lighthouse CI

on:
  push:
    branches: [main, newMain]
  pull_request:
    branches: [main, newMain]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Run Lighthouse CI
        run: |
          bun x @lhci/cli autorun --upload.target=temporary-public-storage
