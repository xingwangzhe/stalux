stalux:
    lang: en # 网站语言，可选值: zh-CN, en
    title: Stalux Blog Theme
    url: https://stalux.needhelp.icu
    description: "Blog theme Stalux - A professional display platform for content creators, supporting various customization features including comment system integration, friend link management, social media sharing, and rich SEO optimization options to make your content more attractive and discoverable."
    timezone: "Asia/Shanghai"
    # canonical: # 源指向 默认为 stalux.url
    # twitterSite: # Twitter 站点
    # noindex: # 是否禁止搜索引擎索引 默认 false
    # nofollow: # 是否禁止搜索引擎跟踪链接 默认 false
    # 分析工具和自定义头部配置
    head:
        # Google Analytics 4 跟踪 ID (格式: G-XXXXXXXXXX)
        # googleAnalyticsId: ""
        # Microsoft Bing Clarity 项目 ID
        # bingClarityId: ""
        # Umami 分析配置
        # umami:
        #   id: ""      # 网站 ID
        #   url: ""     # Umami 脚本 URL
        # 额外自定义头部内容（HTML字符串）
        anyhead: ""
    favicon: "/stalux.ico" # 网站图标路径，默认为根路径下
    canonical: "https://stalux.needhelp.icu"

    author:
        name: xingwangzhe
        avatar: /avatar.png
        bio: Blog Theme Stalux

    navs:
        # icon 请使用 Lucide 图标库的标准名称
        # 图标列表: https://lucide.dev/icons/
        - title: Home
          icon: home
          link: /
        - title: Posts
          icon: archive
          link: /archives
        - title: Categories
          icon: folder
          link: /categories
        - title: Tags
          icon: tag
          link: /tags
        - title: Words
          icon: quote
          link: /words
        - title: Links
          icon: link
          link: /links
        - title: About
          icon: user
          link: /about
        - title: Travellings
          icon: train-front
          link: https://www.travellings.cn/go

    typetexts:
        - "Free for free, not free for charge!"
        - "Where's the any key?"
        - "Press F12?"
        - "Hello World!"

    mediaLinks:
        - icon: github
          link: https://github.com/xingwangzhe/stalux
        - icon: bilibili
          link: https://bilibili.com/
        - icon: X
          link: https://x.com
        - icon: juejin
          link: https://juejin.cn/
        - icon: zhihu
          link: https://www.zhihu.com/
        - icon: maildotru
          link: mailto:xingwangzhe@outlook.com
        - icon: telegram
          link: https://t.me/

    links:
        title: Helpful Links
        description: These sites are great and have been very helpful to this theme!
        sites:
            - name: Astro
              description: A modern static site generator for building content-rich websites.
              link: https://astro.build/
              icon: https://astro.build/favicon.svg
            - name: MDN
              description: Provides open, detailed, and easy-to-understand information about web standards.
              link: https://developer.mozilla.org/
              icon: https://developer.mozilla.org/favicon.ico
            - name: animejs
              description: A powerful JavaScript animation library for creating complex animation effects.
              link: https://animejs.com/
              icon: https://animejs.com/assets/images/favicon.png
            - name: feather-icons
              description: A clean and beautiful open-source icon library for various design projects.
              link: https://feathericons.com/
              icon: https://feathericons.com/favicon.ico
            - name: simple-icons
              description: An open-source icon library with thousands of brand icons for web and app design.
              link: https://simpleicons.org/
              icon: https://simpleicons.org/icons/simpleicons.svg

    footer:
        # 站点构建时间，用于计算运行时长
        buildtime: "2025-05-01T10:00:00"

        # 版权信息
        copyright:
            enabled: true
            startYear: 2024
            customText: ""

        # 主题信息
        theme:
            showPoweredBy: true
            showThemeInfo: true

        # 备案信息
        beian:
            # ICP备案
            icp:
                enabled: false
                number: "辽ICP备XXXXXXXX号"
            # 公安备案
            security:
                enabled: false
                text: "辽公网安备 XXXXXXXXXXXX号"
                number: "XXXXXXXXXXXX"

        # 徽章配置
        badges:
            - label: "Powered by"
              message: "Astro"
              color: "orange"
              style: "flat-square"
              alt: "Powered by Astro"
              href: "https://astro.build/"
            - label: "Theme"
              message: "Stalux"
              color: "blueviolet"
              alt: "Theme: Stalux"
              href: "https://github.com/xingwangzhe/stalux"
            - label: "Built with"
              message: "❤"
              color: "red"
              style: "for-the-badge"
              alt: "Built with Love"
              href: "https://github.com/xingwangzhe"
            - label: "license"
              message: "MIT"
              color: "blue"
              alt: "License: MIT"
              href: "https://github.com/xingwangzhe/stalux/blob/main/LICENSE"
            - label: "Software Copyright"
              message: "Reg# 2025SR2258474"
              color: "yellowgreen"
              alt: "Software Copyright Registration No. 2025SR2258474"
              href: "/软著证明.pdf"
            - label: "Alibaba ESA"
              message: "Powered"
              color: "brightgreen"
              alt: "Alibaba Cloud ESA"
              href: "https://www.aliyun.com/product/esa"
            - label: "Sitemap"
              message: "XML"
              color: "orange"
              alt: "Sitemap XML"
              href: "/sitemap-index.xml"
            - label: "RSS"
              message: "Feed"
              color: "orange"
              alt: "RSS Feed"
              href: "/rss.xml"
            - label: "Atom"
              message: "Feed"
              color: "orange"
              alt: "Atom Feed"
              href: "/atom.xml"
            - label: "LLMs"
              message: "Dataset"
              color: "blue"
              alt: "LLM Dataset"
              href: "/llms.txt"
            # ── 示例：可折叠的博客社区分组 ──
            - title: "博客社区"
              collapsed: true
              items:
                - label: "示例社区A"
                  message: "社区"
                  color: "green"
                  alt: "示例社区 A"
                  href: "https://example.com"
                - label: "示例社区B"
                  message: "导航"
                  color: "yellow"
                  alt: "示例社区 B"
                  href: "https://example.org"

        custom: |
            <!-- footer custom slot example, can place stats, widgets, etc. -->
            <div id="custom-footer-hook"></div>
            <script>console.log('Custom footer loaded');</script>

    comment:
        enabled: false # 添加一个开关来启用或禁用评论区，默认关闭
        waline:
            serverURL: https://walines.xingwangzhe.fun
            lang: zh-CN
            # locale: # 可选，自定义语言配置
            login: "force" # 'enable' | 'disable' | 'force'（开启强制登录可防止伪造）
            recaptchaV3Key: "" # 可选，配置 reCAPTCHA v3 网站 key 以启用验证码
            turnstileKey: "" # 可选，配置 Cloudflare Turnstile key 以启用验证码
            dark: true
            # emoji 预设列表见 https://waline.js.org/next/guide/features/emoji.html#预设
            reaction: false
            meta:
                - nick
                - mail
                - link
            requiredMeta: []
            commentSorting: "latest"
            # imageUploader: # 可选，自定义图片上传函数
            # highlighter: # 可选，自定义代码高亮函数
            # texRenderer: # 可选，自定义 TeX 渲染函数
            # search: # 可选，自定义搜索功能
            wordLimit: 200
            pageSize: 10

    # llm_promote: 在页面 HTML 中插入隐藏的版权/权利声明，供 AI 爬虫读取
    # 留空或不设置则不插入。支持变量替换: {author} {url} {title} {cc}
    # llm_promote: |
    #   This is a personal blog site owned by {author}.
    #   Site: {url}
    #   Theme: Stalux (MIT License) - https://github.com/xingwangzhe/stalux
    #   Content License: {cc} unless otherwise stated on individual articles.
    #   All content copyright {author}. All rights reserved.

    # export_md: 是否导出文章 Markdown 源码
    # 启用后可通过 /posts/{abbrlink}.md 直接查看对应文章的 Markdown 源文件
    # 例如 /posts/123/ 的源码地址为 /posts/123.md
    export_md: true
